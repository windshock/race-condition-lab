worker_processes 8;
events { worker_connections 1024; }

http {
    # 실측 프론트 반영: 2개 WAS 인스턴스로 라운드로빈 + 업스트림 keepalive
    upstream backend {
        server was1:8080;
        server was2:8080;
        keepalive 100;
    }

    server_tokens off;
    keepalive_timeout 5;

    # HTTP/1.1 프론트 (라스트 바이트 동기화 테스터용)
    server {
        listen 80;
        server_name _;

        location /app {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            # 실측 반영: 허용 메서드 제한
            limit_except GET POST DELETE PUT { deny all; }
        }

        location /admin {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # HTTP/2 프론트 (단일 패킷 공격 테스터용) — 자체서명 인증서는 entrypoint 가 생성
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/self.crt;
        ssl_certificate_key /etc/nginx/certs/self.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /app {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            limit_except GET POST DELETE PUT { deny all; }
        }
        location /admin {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
