# 실제 운영 스택 재현: nginx(프론트) + Tomcat(Spring Boot) 2인스턴스 + 공유 Postgres + Redis(분산락)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claim
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claim
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 최초 기동 시 스키마 1회 생성
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # WAS 인스턴스 2개 — 같은 이미지, 같은 DB(공유), INSTANCE_NAME 만 다름
  was1:
    build: ./app
    environment:
      INSTANCE_NAME: was1
      DB_URL: jdbc:postgresql://db:5432/claim
      DB_USER: claim
      DB_PASSWORD: claim
      REDIS_HOST: redis
      RACE_WINDOW_MS: "50"
      DEFAULT_LOCK_MODE: none
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  was2:
    build: ./app
    environment:
      INSTANCE_NAME: was2
      DB_URL: jdbc:postgresql://db:5432/claim
      DB_USER: claim
      DB_PASSWORD: claim
      REDIS_HOST: redis
      RACE_WINDOW_MS: "50"
      DEFAULT_LOCK_MODE: none
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    build: ./nginx
    ports:
      - "8080:80"     # HTTP/1.1  -> race_test_claim.py
      - "8443:443"    # HTTP/2    -> race_test_single_packet.py
    depends_on:
      - was1
      - was2
